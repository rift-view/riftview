name: Lockfile override gate

# RIFT-134: gate enforces based on non-bot lockfile changes + qualifying
# CODEOWNER approval. The `lockfile-override-approved` label is an audit
# marker, not the enforcement trigger — gate fails whenever a PR has
# non-bot lockfile changes without a qualifying approval, regardless of
# label state. This closes the race where applying the label transiently
# produced a green gate (removal fired unlabeled → label absent → gate
# treated as no-op).
#
# `pull_request_target` is required so the workflow has `pull-requests: write`
# on PRs from forks. Safety: we never check out PR head — only the base
# CODEOWNERS file via sparse-checkout — so an attacker can't get script
# execution from a malicious PR head. Author email detection uses the
# compare API (safe read-only endpoint).

on:
  pull_request_target:
    types: [labeled, unlabeled, synchronize, reopened, opened]
  pull_request_review:
    types: [submitted, dismissed, edited]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: lockfile-override-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      OVERRIDE_LABEL: lockfile-override-approved
      REPO: ${{ github.repository }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      PR_AUTHOR: ${{ github.event.pull_request.user.login }}
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Checkout base CODEOWNERS (sparse, no PR head)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          sparse-checkout: |
            .github/CODEOWNERS
          sparse-checkout-cone-mode: false
          persist-credentials: false
          fetch-depth: 1

      - name: Enforce lockfile override policy
        run: |
          set -euo pipefail

          echo "Checking pnpm-lock.yaml change status using compare API (base=${BASE_SHA:0:7}, head=${HEAD_SHA:0:7})"

          # 1. Has pnpm-lock.yaml changed? And is any commit author a non-bot?
          COMPARE=$(gh api "/repos/$REPO/compare/${BASE_SHA}...${HEAD_SHA}")
          LOCKFILE_CHANGED=$(printf '%s' "$COMPARE" | jq -r '.files[]? | select(.filename == "pnpm-lock.yaml") | .filename')

          if [ -z "$LOCKFILE_CHANGED" ]; then
            echo "pnpm-lock.yaml not changed in this PR — gate is a no-op."
            exit 0
          fi

          echo "pnpm-lock.yaml changed. Checking commit authors for non-bot commits..."
          BOT_PATTERN='^([0-9]+\+)?(renovate|dependabot|github-actions)\[bot\]@users\.noreply\.github\.com$'
          NON_BOT_FOUND=""
          while IFS= read -r email; do
            [ -z "$email" ] && continue
            if ! echo "$email" | grep -qE "$BOT_PATTERN"; then
              NON_BOT_FOUND="true"
              echo "  non-bot commit by: $email"
              break
            fi
          done < <(printf '%s' "$COMPARE" | jq -r '.commits[]?.commit.author.email')
          if [ -z "$NON_BOT_FOUND" ]; then
            echo "pnpm-lock.yaml changed only in bot commits — gate is a no-op."
            exit 0
          fi

          echo "PR has non-bot changes to pnpm-lock.yaml. Enforcement active."

          # 2. Current label state (audit only — does not gate enforcement).
          LABELS=$(gh pr view "$PR_NUMBER" --repo "$REPO" --json labels --jq '.labels[].name')
          LABEL_PRESENT=""
          if printf '%s\n' "$LABELS" | grep -qx "$OVERRIDE_LABEL"; then
            LABEL_PRESENT="true"
          fi

          # 3. Resolve owners-of(pnpm-lock.yaml) from base CODEOWNERS.
          #    Last matching pattern wins (standard CODEOWNERS semantics).
          if [ ! -f .github/CODEOWNERS ]; then
            echo "::error::.github/CODEOWNERS not found at base ref — cannot determine owners"
            exit 1
          fi
          OWNERS=$(awk '
            /^[[:space:]]*#/ { next }
            NF < 2 { next }
            {
              pat = $1
              if (pat == "*" || pat == "**" || pat == "pnpm-lock.yaml" || pat == "/pnpm-lock.yaml") {
                $1 = ""
                sub(/^[[:space:]]+/, "")
                last = $0
              }
            }
            END { print last }
          ' .github/CODEOWNERS)
          if [ -z "$OWNERS" ]; then
            echo "::error::No CODEOWNERS rule matches pnpm-lock.yaml — add a rule and re-run"
            exit 1
          fi
          echo "CODEOWNERS owners-of(pnpm-lock.yaml): $OWNERS"

          # 4. Resolve owner tokens (@user or @org/team) into a flat login set.
          OWNER_LOGINS=()
          for tok in $OWNERS; do
            case "$tok" in
              @*/*)
                team_path="${tok#@}"
                org="${team_path%/*}"
                slug="${team_path#*/}"
                members=$(gh api "/orgs/$org/teams/$slug/members" --jq '.[].login' 2>/dev/null || true)
                for m in $members; do OWNER_LOGINS+=("$m"); done
                ;;
              @*)
                OWNER_LOGINS+=("${tok#@}")
                ;;
            esac
          done
          if [ "${#OWNER_LOGINS[@]}" -eq 0 ]; then
            echo "::error::CODEOWNERS owners did not resolve to any user logins: $OWNERS"
            exit 1
          fi
          echo "Resolved CODEOWNER logins: ${OWNER_LOGINS[*]}"
          echo "PR author (excluded from self-approval): $PR_AUTHOR"

          # 5. Latest review state per reviewer. A later "request changes"
          #    or "dismissed" review supersedes an earlier APPROVED.
          REVIEWS=$(gh api --paginate "/repos/$REPO/pulls/$PR_NUMBER/reviews")
          APPROVED_REVIEWERS=$(printf '%s' "$REVIEWS" | jq -r '
            map(select(.user != null))
            | group_by(.user.login)
            | map(sort_by(.submitted_at // "") | last)
            | map(select(.state == "APPROVED"))
            | .[].user.login
          ')
          echo "Latest-state APPROVED reviewers: $APPROVED_REVIEWERS"

          # 6. Intersect APPROVED reviewers ∩ owner logins, excluding PR_AUTHOR.
          QUALIFYING=""
          while IFS= read -r reviewer; do
            [ -z "$reviewer" ] && continue
            if [ "$reviewer" = "$PR_AUTHOR" ]; then
              echo "  - $reviewer: SELF — does not count"
              continue
            fi
            for owner in "${OWNER_LOGINS[@]}"; do
              if [ "$reviewer" = "$owner" ]; then
                QUALIFYING="$reviewer"
                break
              fi
            done
            if [ -n "$QUALIFYING" ]; then break; fi
          done <<< "$APPROVED_REVIEWERS"

          # 7. Decision: label is audit marker, not enforcement trigger.
          if [ -n "$QUALIFYING" ]; then
            if [ -z "$LABEL_PRESENT" ]; then
              gh pr edit "$PR_NUMBER" --repo "$REPO" --add-label "$OVERRIDE_LABEL"
              echo "Applied '$OVERRIDE_LABEL' (audit marker for qualifying approval by $QUALIFYING)"
            fi
            echo "Override approved by non-author CODEOWNER: $QUALIFYING"
            exit 0
          fi

          # 8. No qualifying approval. Remove label if present (audit), fail.
          if [ -n "$LABEL_PRESENT" ]; then
            echo "::error::'$OVERRIDE_LABEL' applied without a non-author CODEOWNER approving review"
            gh pr edit "$PR_NUMBER" --repo "$REPO" --remove-label "$OVERRIDE_LABEL"
            BODY_FILE=$(mktemp)
            {
              echo "The \`$OVERRIDE_LABEL\` label was removed by the **Lockfile override gate** workflow."
              echo
              echo "This PR modifies \`pnpm-lock.yaml\` in non-bot commits. The override requires an approving review from a non-author owner listed in [\`.github/CODEOWNERS\`](.github/CODEOWNERS) for \`pnpm-lock.yaml\`."
              echo
              echo "Eligible CODEOWNER approvers (excluding the PR author \`$PR_AUTHOR\`):"
              for owner in "${OWNER_LOGINS[@]}"; do
                if [ "$owner" != "$PR_AUTHOR" ]; then
                  echo "- @$owner"
                fi
              done
              echo
              echo "A qualifying approval will automatically apply the label. Background: RIFT-134, \`.github/workflows/lockfile-override-gate.yml\`."
            } > "$BODY_FILE"
            gh pr comment "$PR_NUMBER" --repo "$REPO" --body-file "$BODY_FILE"
          else
            echo "::error::Lockfile override not approved — requires non-author CODEOWNER approving review for pnpm-lock.yaml changes"
          fi
          exit 1