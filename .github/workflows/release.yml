name: Release

on:
  push:
    tags: ['v*']
  # Rehearse the same packaging/tests without signing secrets or publication.
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/release.yml'
      - 'apps/desktop/package.json'
      - 'apps/desktop/electron-builder.yml'
      - 'apps/desktop/tests/e2e/**'
      - 'pnpm-lock.yaml'
      - '.npmrc'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow_ref }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify-ci:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v4
        if: github.event_name == 'push'
      - name: Verify stable release tag matches application version
        if: github.event_name == 'push'
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          expected=$(node -p "'v' + require('./apps/desktop/package.json').version")
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ || "$RELEASE_TAG" != "$expected" ]]; then
            echo "::error::Expected stable release tag $expected, got $RELEASE_TAG. Prerelease channels are not configured."
            exit 1
          fi
      - name: Verify main CI green on this commit
        if: github.event_name == 'push'
        run: |
          set -euo pipefail
          # Bind the gate to CI's main-branch push run at the exact release
          # commit, rather than accepting unrelated checks with matching names.
          conclusion=$(gh api --method GET "repos/$GH_REPO/actions/workflows/ci.yml/runs" \
            -f head_sha="$RELEASE_SHA" -f branch=main -f event=push -f per_page=100 \
            --jq '.workflow_runs | sort_by(.run_number) | last | .conclusion // "missing"')
          echo "Main CI on $RELEASE_SHA: $conclusion"
          if [[ "$conclusion" != "success" ]]; then
            echo "::error::Main CI not green on $RELEASE_SHA ($conclusion). Push tag after main CI passes."
            exit 1
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_SHA: ${{ github.sha }}

  release:
    needs: [verify-ci]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: mac
          - os: ubuntu-latest
            platform: linux
    runs-on: ${{ matrix.os }}
    # Asymmetric gate:
    #   Linux: full LocalStack-backed @release spec (scan-blast-radius)
    #   macOS: lighter @release-mac spec (demo mode, no LocalStack)
    # macos-latest (macos-15 arm64) can't run Docker — colima can't nested-
    # virtualize on current GHA Apple Silicon runners. The mac spec gates
    # boot + canvas + Inspector which catches mac-specific regressions
    # (signing, ABI, native modules) without needing AWS plumbing.
    env:
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_REGION: us-east-1
      AWS_ENDPOINT_URL: http://localhost:4566
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      # --- Linux-only LocalStack prereqs ---
      - uses: hashicorp/setup-terraform@v3
        if: runner.os == 'Linux'
        with:
          terraform_version: 1.9.x
      - name: Start LocalStack
        if: runner.os == 'Linux'
        run: docker compose -f .localstack/compose.yml up -d
      - name: Wait for LocalStack
        if: runner.os == 'Linux'
        run: ./scripts/wait-localstack.sh
      - name: Seed LocalStack
        if: runner.os == 'Linux'
        working-directory: apps/cli/tests/integration/fixtures
        run: terraform init -input=false && terraform apply -auto-approve -input=false
      # --- Both platforms build the binary + run Playwright ---
      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium
      - name: Build unsigned binary (for @release E2E)
        # One shared pipeline: build → deploy → Electron-ABI rebuild → package.
        run: pnpm --filter @riftview/desktop run build:unpack
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Run @release E2E (Linux — full LocalStack)
        if: runner.os == 'Linux'
        run: xvfb-run -a pnpm run test:e2e:release
        env:
          CI: 'true'
      - name: Run @release E2E (mac — demo-mode smoke)
        if: runner.os == 'macOS'
        run: pnpm run test:e2e:release:mac
        env:
          CI: 'true'
      # libfuse2 is required for electron-builder's AppImage target on
      # ubuntu-latest (removed from default image; app-builder-bin needs it).
      - name: Install libfuse2 for AppImage (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libfuse2
      - name: Package rehearsal installers
        if: github.event_name != 'push'
        working-directory: apps/desktop/deploy
        run: pnpm exec electron-builder --${{ matrix.platform }} --publish never -c.mac.notarize=false
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Package signed release installers
        if: github.event_name == 'push'
        working-directory: apps/desktop/deploy
        # Reuse the tested deployment tree; never rebuild source after testing.
        # Publishing is a separate job, after every platform finishes.
        run: pnpm exec electron-builder --${{ matrix.platform }} --publish never
        env:
          CSC_FOR_PULL_REQUEST: 'false'
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      - name: Verify macOS signature and notarization
        if: github.event_name == 'push' && runner.os == 'macOS'
        run: |
          set -euo pipefail
          shopt -s nullglob
          apps=(apps/desktop/dist/mac*/RiftView.app)
          [ "${#apps[@]}" -eq 1 ]
          codesign --verify --deep --strict --verbose=2 "${apps[0]}"
          spctl --assess --type execute --verbose=2 "${apps[0]}"
          xcrun stapler validate "${apps[0]}"
      - name: Test final packaged app (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a pnpm run test:e2e:release
        env:
          CI: 'true'
      - name: Test final packaged app (macOS)
        if: runner.os == 'macOS'
        run: pnpm run test:e2e:release:mac
        env:
          CI: 'true'
      - name: Stage distribution files
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          mkdir -p release-assets
          if [ "$PLATFORM" = mac ]; then
            dmg=(apps/desktop/dist/*.dmg)
            zip=(apps/desktop/dist/*-mac.zip)
            [ "${#dmg[@]}" -eq 1 ]
            [ "${#zip[@]}" -eq 1 ]
            cp "${dmg[@]}" "${zip[@]}" apps/desktop/dist/latest-mac.yml release-assets/
          else
            images=(apps/desktop/dist/*.AppImage)
            [ "${#images[@]}" -eq 1 ]
            cp "${images[@]}" apps/desktop/dist/latest-linux.yml release-assets/
          fi
          blockmaps=(apps/desktop/dist/*.blockmap)
          if [ "${#blockmaps[@]}" -gt 0 ]; then cp "${blockmaps[@]}" release-assets/; fi
      - name: Upload validated distribution files
        uses: actions/upload-artifact@v4
        with:
          name: release-assets-${{ matrix.platform }}
          path: release-assets/*
          if-no-files-found: error
          retention-days: 14
      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-release-${{ matrix.platform }}
          path: apps/desktop/tests/e2e/playwright-report
          retention-days: 30
      - name: LocalStack logs on failure
        if: failure() && runner.os == 'Linux'
        run: docker compose -f .localstack/compose.yml logs localstack | tail -200

  publish:
    needs: [release]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: release-assets-*
          path: release-assets
          merge-multiple: true
      - name: Publish validated assets after both platforms pass
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # A fresh draft keeps partial uploads invisible. Do not overwrite an
          # existing release: a failed publication is inspected before retry.
          gh release create "$RELEASE_TAG" --verify-tag --draft --generate-notes
          gh release upload "$RELEASE_TAG" release-assets/*
          gh release edit "$RELEASE_TAG" --draft=false
